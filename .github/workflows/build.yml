name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the .NET Framework C# compiler (same as src\build.cmd)
        shell: cmd
        env:
          CI: "true"
        run: src\build.cmd

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $dir = "TroopersSkate3Launcher-$version"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "bin\Trooper's Skate 3 Recomp Launcher.exe" $dir
          Copy-Item README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir-win.zip"
          "ZIP=$dir-win.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TroopersSkate3Launcher
          path: ${{ env.ZIP }}

      - name: Draft GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          draft: true
